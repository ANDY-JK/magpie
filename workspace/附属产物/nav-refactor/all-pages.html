<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magpie · 全部页面原型（简约版）</title>
<style>
:root{
  --bg:#f4f4f6; --card:#fff; --card-2:#f9f9fb; --pill:#f1f1f4; --pill-hover:#e9e9ee;
  --seg-track:#e6e6eb; --seg-thumb:#fff;
  --seg-edge:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);
  --line:#e3e3e8; --line-2:#ececf0; --fg:#1c1c21; --fg-2:#4b4b53; --muted:#85858d; --faint:#b9b9c2;
  --ctl:#63636b; --accent:#4f46e5; --accent-soft:#eeedfd; --accent-fg:#fff;
  --green:#189a58; --amber:#b45309; --red:#d64545;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --code:ui-monospace,"SF Mono",Menlo,Consolas,"Microsoft YaHei UI",monospace;
  --shadow:0 16px 44px rgba(20,22,30,.16),0 2px 8px rgba(20,22,30,.06),0 0 0 .5px rgba(20,22,30,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.07);
  --stage:#e6e7ec; --pop:rgba(255,255,255,.94);
}
[data-theme="dark"]{
  --bg:#1a1a1e; --card:#232327; --card-2:#1f1f23; --pill:#2d2d33; --pill-hover:#36363d;
  --seg-track:rgba(255,255,255,.035); --seg-thumb:rgba(255,255,255,.15);
  --seg-edge:inset 0 .5px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.3);
  --line:#333339; --line-2:#2c2c32; --fg:#ededf1; --fg-2:#b9b9c1; --muted:#8b8b94; --faint:#56565f;
  --ctl:#a1a1aa; --accent:#a5b4fc; --accent-soft:#2b2c47; --accent-fg:#14142a;
  --green:#6fd99b; --amber:#f2b544; --red:#f28b82;
  --shadow:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.09);
  --stage:#0f1013; --pop:rgba(38,38,43,.96);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--fg);background:var(--stage);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:84px 12px 24px;gap:10px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;appearance:none;text-align:left}
.ic{width:16px;height:16px;flex:none;color:var(--muted)}

/* 顶栏 */
.proto{position:fixed;top:9px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px 8px;padding:5px 8px;border-radius:12px;background:var(--pop);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 24px)}
.ptitle{font-size:12px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--seg-track)}
.seg button{height:23px;padding:0 9px;border-radius:6px;font-size:11.5px;color:var(--ctl);white-space:nowrap}
.seg button.on{background:var(--seg-thumb);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.sep{width:1px;height:17px;background:var(--line)}
.tbtn{height:23px;padding:0 9px;border-radius:7px;font-size:11.5px;color:var(--ctl);background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.tbtn:hover{color:var(--fg)}
.where{font-size:11px;color:var(--muted);white-space:nowrap}

/* 窗口 */
.win{flex:none;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.win.wide{width:1180px;max-width:100%;height:580px}
.win.narrow{width:720px;max-width:100%;height:580px}
.top{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none;border-bottom:.5px solid var(--line-2)}
.lights{display:flex;gap:7px;margin-right:2px}
.lights i{width:11px;height:11px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.brand{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.logo{width:18px;height:18px;color:var(--fg);display:inline-flex}
.logo svg{display:block;width:100%;height:100%}
.crumb{font-size:12px;color:var(--muted);padding-left:4px;white-space:nowrap}
.actions{margin-left:auto;display:flex;align-items:center;gap:5px}
.btn{height:25px;padding:0 8px;border-radius:7px;font-size:11px;color:var(--fg-2);background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.03);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.iconbtn{width:25px;height:25px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn.on{background:var(--pill);color:var(--fg)}
.main{flex:1;display:flex;min-height:0}

/* 宽窗侧栏：一级分区 + 二级页面 */
.side{width:196px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--line);background:var(--bg);padding:0 8px 7px}
.head{height:44px;display:flex;align-items:center;gap:7px;padding:0 4px;flex:none}
.jump{margin:0 0 5px;display:flex;align-items:center;gap:6px;height:25px;padding:0 7px;border-radius:7px;background:var(--pill);color:var(--muted);font-size:11px;width:100%}
.jump .ic{width:12px;height:12px}
.scroll{flex:1;overflow:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.secrow{display:flex;align-items:center;gap:7px;width:100%;height:30px;padding:0 7px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.secrow:hover{background:var(--pill);color:var(--fg)}
.secrow.on{color:var(--fg)}
.secrow .chev{margin-left:auto;color:var(--faint);font-size:10px;transition:transform .15s}
.secrow.on .chev{transform:rotate(90deg)}
.pages{display:flex;flex-direction:column;gap:1px;margin:0 0 3px 15px;padding-left:7px;border-left:1px solid var(--line)}
.pagerow{display:flex;align-items:center;gap:7px;height:27px;padding:0 6px;border-radius:6px;font-size:12px;color:var(--muted);white-space:nowrap;width:100%}
.pagerow:hover{background:var(--pill);color:var(--fg)}
.pagerow.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.pagerow .ic{width:14px;height:14px}
.pagerow.on .ic{color:var(--fg)}
.footnav{flex:none;border-top:.5px solid var(--line-2);padding:5px 0 0;margin-top:3px}

/* 窄窗：一级分区条 + 二级页面条 */
.secstrip{flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;height:34px;border-bottom:.5px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.secstrip::-webkit-scrollbar{display:none}
.sec{flex:none;height:24px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--ctl);white-space:nowrap}
.sec:hover{background:var(--pill);color:var(--fg)}
.sec.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge)}
.pagestrip{flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;height:31px;border-bottom:.5px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.pagestrip::-webkit-scrollbar{display:none}
.pagestrip .tab{flex:none;height:23px;padding:0 8px;border-radius:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.pagestrip .tab.on{background:var(--card-2);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.tabstrip{flex:none;display:flex;align-items:center;gap:3px;padding:0 8px;height:34px;border-bottom:.5px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip .tab{flex:none;height:23px;padding:0 8px;border-radius:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.tabstrip .tab.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.gchip{flex:none;height:17px;display:inline-flex;align-items:center;padding:0 5px;border-radius:5px;background:var(--pill);font-size:9.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.gchip.on{background:var(--accent-soft);color:var(--accent)}
.tsep{flex:none;width:1px;height:14px;background:var(--line);margin:0 3px}

/* 内容 */
.view{flex:1;min-width:0;overflow:auto;padding:9px 12px 16px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.vtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:7px}
.vtabs::-webkit-scrollbar{display:none}
.vtabs .tab{flex:none;height:23px;padding:0 8px;border-radius:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.vtabs .tab.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.l3{display:flex;gap:2px;margin:-2px 0 7px;overflow-x:auto;scrollbar-width:none}
.l3::-webkit-scrollbar{display:none}
.l3 .tab{flex:none;height:21px;padding:0 7px;border-radius:6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.l3 .tab.on{background:var(--card-2);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}

/* 工具栏 */
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.field{height:25px;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.03);display:flex;align-items:center;gap:5px;padding:0 8px;font-size:10.5px;color:var(--muted);width:150px}
.field .ic{width:12px;height:12px}
.segline{display:inline-flex;padding:2px;border-radius:8px;background:var(--seg-track);gap:1px}
.segline .segbtn{height:21px;padding:0 7px;border-radius:5px;font-size:10.5px;color:var(--ctl);white-space:nowrap}
.segline .segbtn.on{background:var(--seg-thumb);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.win.narrow .toolbar .field{flex:1;width:auto}
.win.narrow .toolbar{flex-wrap:nowrap}

/* 列表与卡片 */
.list{background:var(--card);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:.5px solid var(--line-2)}
.item:first-child{border-top:0}
.logo2{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex:none}
.who{flex:1;min-width:0}
.nm{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.dot.amber{background:var(--amber)}
.dot.red{background:var(--red)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}
.win.narrow .stats{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border-radius:9px;padding:8px 10px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:10px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.chart{background:var(--card);border-radius:9px;padding:9px 11px;box-shadow:var(--shadow-sm)}
.chart .k{font-size:10px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:5px;height:58px;margin-top:6px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:var(--accent);opacity:.85;min-height:3px}
.bars i:nth-child(3n){opacity:.5}

.lib-split{display:grid;grid-template-columns:1.05fr 1fr;gap:8px}
.win.narrow .lib-split{grid-template-columns:1fr}
.lib-list{display:flex;flex-direction:column;gap:4px}
.lib-item{display:flex;align-items:center;gap:7px;padding:6px 8px;background:var(--card);border-radius:8px;box-shadow:var(--shadow-sm);width:100%;text-align:left}
.lib-item.on{box-shadow:0 0 0 1.5px var(--accent),var(--shadow-sm)}
.lib-item .who{flex:1;min-width:0}
.lib-item .nm,.lib-item .sub{display:block}
.lib-detail{background:var(--card);border-radius:8px;box-shadow:var(--shadow-sm);padding:9px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.det-h{font-size:12px;font-weight:600;margin-bottom:1px}
.det-row{display:flex;gap:7px;font-size:10px;line-height:1.4}
.det-row span{width:54px;color:var(--muted);flex:none}
.det-row b{font-weight:500;color:var(--fg-2);word-break:break-all}
.det-row b.mono{font-family:ui-monospace,Consolas,monospace;font-size:9px}
.rowbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.btn.danger{color:var(--red);box-shadow:0 0 0 .5px color-mix(in srgb,var(--red) 35%,transparent)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:7px}
.win.narrow .cols{grid-template-columns:1fr}
.card{background:var(--card);border-radius:9px;box-shadow:var(--shadow-sm);overflow:hidden}
.card h4{font-size:10.5px;font-weight:600;color:var(--muted);padding:8px 10px 5px}
.card .item{padding:7px 10px}
.quota{height:4px;border-radius:2px;background:var(--pill);width:54px;overflow:hidden;flex:none}
.quota i{display:block;height:100%;background:var(--accent)}

.switch{width:30px;height:18px;border-radius:999px;background:var(--pill);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:14px}

.uses{width:1120px;max-width:100%;background:var(--card);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.uses table{width:100%;border-collapse:collapse;font-size:11px}
.uses th,.uses td{padding:6px 9px;border-top:.5px solid var(--line-2);text-align:left}
.uses th{font-size:9.5px;color:var(--muted);font-weight:600;border-top:0}
.uses tr.on td{background:var(--accent-soft)}
.uses td:first-child{font-weight:500}
.uses .secn{color:var(--muted)}
.uses .comps{color:var(--fg-2)}
/* 标注与规格表 */
.spec-reg{position:relative;outline:1.5px dashed var(--accent);outline-offset:2px;border-radius:8px;margin-bottom:6px;padding:1px 3px 3px}
.spec-reg.sel{outline-color:var(--green);outline-width:2px}
.spec-head{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:600;color:var(--accent);padding:1px 0 2px;cursor:pointer}
.spec-reg.sel .spec-head{color:var(--green)}
.spec-badge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-size:8.5px;font-weight:700;line-height:1}
.spec-reg.sel .spec-badge{background:var(--green);color:#fff}
.spec-tables{width:1120px;max-width:100%;display:flex;flex-direction:column;gap:8px}
.spec-tables h3{font-size:12px;font-weight:600;margin:0}
.spec-tables .tag{font-size:9.5px;color:var(--muted);font-weight:400;margin-left:6px}
#pageSpec th:first-child,#pageSpec td:first-child{width:46px}
#pageSpec th:nth-child(2),#pageSpec td:nth-child(2){width:96px}
#pageSpec th:nth-child(4),#pageSpec td:nth-child(4){width:270px}
#compIndex th:first-child,#compIndex td:first-child{width:46px}
#compIndex th:nth-child(2),#compIndex td:nth-child(2){width:88px}
#compIndex th:nth-child(3),#compIndex td:nth-child(3){width:120px}
#compIndex th:nth-child(5),#compIndex td:nth-child(5){width:220px}
.index{width:1120px;max-width:100%}
.index summary{cursor:pointer;font-size:12px;font-weight:600;padding:6px 2px}
.index summary::marker{color:var(--muted)}
#allIndex th:nth-child(2),#allIndex td:nth-child(2){width:230px}
#allIndex th:nth-child(3),#allIndex td:nth-child(3){width:300px}
#allIndex th:nth-child(4),#allIndex td:nth-child(4){width:320px}
.spec-hint{font-size:10px;color:var(--muted);line-height:1.5;max-width:900px;text-align:center}
.foldrow{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:10.5px;color:var(--muted)}
.foldrow .note{font-size:9.5px;color:var(--faint)}
.preview{background:var(--bg);border-radius:6px;padding:8px 10px;font:10px/1.5 ui-monospace,Consolas,monospace;color:var(--fg-2);white-space:pre-wrap}
.progress{height:6px;border-radius:3px;background:var(--pill);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.panelwin{width:360px;height:480px;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden}
.panel-top{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:.5px solid var(--line-2);font-weight:600;font-size:13px}
.panel-tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:.5px solid var(--line-2)}
.ptab{height:24px;padding:0 9px;border-radius:6px;font-size:11px;color:var(--muted)}
.ptab.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.panel-body{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.panel-body::-webkit-scrollbar{display:none}
.panel-foot{height:34px;display:flex;align-items:center;padding:0 10px;border-top:.5px solid var(--line-2)}
.phonewin{width:360px;height:720px;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone-top{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:.5px solid var(--line-2);font-weight:600;font-size:13px}
.phone-main{flex:1;min-height:0;display:flex}
.phone-secs{height:44px;display:flex;align-items:center;justify-content:space-around;border-top:.5px solid var(--line-2)}
.psec{font-size:10px;color:var(--muted);padding:4px 6px;border-radius:6px}
.psec.on{color:var(--fg);background:var(--card);box-shadow:var(--seg-edge);font-weight:500}
.prow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;background:var(--card);border-top:.5px solid var(--line-2);text-align:left}
.prow:first-child{border-top:0}
.prow.open{background:var(--card-2)}
.prow .who{display:flex;flex-direction:column;min-width:0;flex:1}
.prow .nm,.prow .sub{display:block}
.prow .chev{color:var(--faint);font-size:10px}
.prow-edit{padding:6px 12px 10px 42px;background:var(--card-2);border-top:.5px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.prow-edit .item{border-top:0;padding:4px 0}
.subhead{font-size:9.5px;font-weight:600;color:var(--muted);margin:3px 0 0}
.phonewin .lib-split{grid-template-columns:1fr}
.phonewin .cols{grid-template-columns:1fr}
.phonewin .stats{grid-template-columns:1fr 1fr}
.panel-body .who,.phonewin .who{display:flex;flex-direction:column;min-width:0}
.panel-body .nm,.panel-body .sub,.phonewin .nm,.phonewin .sub{display:block}
.panelwin .stats{grid-template-columns:1fr 1fr}
.ov-input{flex:1;height:26px;border:0;border-radius:6px;background:var(--bg);box-shadow:0 0 0 .5px var(--line);padding:0 8px;font-size:11px;color:var(--fg);min-width:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.font-preview{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:14px;color:var(--fg-2);text-align:center}
.err-state{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--red) 10%,var(--card));color:var(--red);font-size:11px}
button:focus-visible,.lib-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.formrow{display:flex;align-items:center;gap:8px}
.formrow label{width:56px;font-size:10px;color:var(--muted);flex:none}
.formrow .ov-search{flex:1}
.keycap{background:var(--bg);border-radius:8px;padding:10px;text-align:center;font:13px ui-monospace,Consolas,monospace;color:var(--fg-2);box-shadow:inset 0 0 0 .5px var(--line)}
.ov-list{display:flex;flex-direction:column;gap:1px}
.mi.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.grow{flex:1}
.textbtn{font-size:10px;color:var(--muted);padding:0 6px;height:20px;border-radius:5px}
.textbtn:hover{background:var(--pill);color:var(--fg)}
.empty-list{border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;font-size:11px;color:var(--faint)}
.skel-list{display:flex;flex-direction:column;gap:6px;padding:4px}
.skel-list i{height:12px;border-radius:6px;background:var(--pill);display:block}
.skel-list i:nth-child(2){width:82%}
.skel-list i:nth-child(3){width:66%}
.skel-list i:nth-child(4){width:74%}
.sheet-inline{background:var(--card);border-radius:10px;box-shadow:var(--shadow-sm);padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.toast{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);font-size:11px;padding:7px 11px;border-radius:8px;box-shadow:var(--shadow);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.ov{position:absolute;inset:0;z-index:30;background:rgba(20,22,30,.18);display:flex;align-items:center;justify-content:center}
.ov-sheet{width:min(430px,92%);background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.ov-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.ov-h .grow{flex:1}
.ov-close{width:24px;height:24px;border-radius:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.ov-close:hover{background:var(--pill);color:var(--fg)}
.ov-search{height:28px;border-radius:7px;background:var(--bg);box-shadow:0 0 0 .5px var(--line);display:flex;align-items:center;padding:0 9px;font-size:11px;color:var(--muted)}
.ov-tiles{display:flex;flex-wrap:wrap;gap:5px}
.ov-tile{height:28px;padding:0 10px;border-radius:7px;background:var(--bg);box-shadow:0 0 0 .5px var(--line);font-size:11px;color:var(--fg-2)}
.ov-tile:hover{background:var(--pill)}
.ov-menu{position:absolute;width:152px;background:var(--pop);border-radius:9px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;gap:1px}
.mi{height:26px;padding:0 8px;border-radius:5px;font-size:11px;color:var(--fg-2);display:flex;align-items:center;width:100%}
.mi:hover{background:var(--pill);color:var(--fg)}
.mi.danger{color:var(--red)}
.msep{height:1px;background:var(--line-2);margin:3px 0}
.caption{font-size:10.5px;color:var(--muted);line-height:1.5;max-width:900px;text-align:center}

function listStateOn(){
  if(state.listState==='normal') return false;
  if(['agents','sessions','providers','doctor','masking','library','plugins'].includes(state.page)) return true;
  if(state.page==='usage' && ['请求','会话','榜单'].includes(state.tabs.usage)) return true;
  return false;
}
function emptyState(){ return `<div class="empty-list">暂无内容</div>`; }
function skeletonState(){ return `<div class="skel-list"><i></i><i></i><i></i><i></i></div>`; }
function errorState(){ return `<div class="err-state"><span>读取失败：连接超时</span><button class="btn" data-act="retry">重试</button></div>`; }
function bodyBlocks(page, kind){
  if(listStateOn()) return [state.listState==='empty' ? emptyState() : state.listState==='loading' ? skeletonState() : errorState()];
  const p = PAGES[page];
  const tab = p && p.tabs ? (state.tabs[page] || p.tabs[0]) : null;
  const f = tab && TAB_BODIES[page] && TAB_BODIES[page][tab];
  if(f) return f();
  if(kind==='agents') return mdAgents();
  if(kind==='sessions') return mdSessions();
  if(kind==='usage' || kind==='metrics') return [statsHtml(), chartHtml()];
  if(kind==='routing') return [routingCols()];
  if(kind==='plugins') return mdPlugins();
  if(kind==='doctor') return mdDoctor();
  if(kind==='masking') return [maskStats(), mdMasking()];
  if(kind==='settings') return [settingsList()];
  if(kind==='gateway') return [listRows('gateway'), mdKeys()];
  if(kind==='providers') return [providersInline(), foldRow()];
  return [listRows(kind)];
}
function bodyNamesFor(page, tab){
  if(listStateOn()) return [state.listState==='empty' ? '空状态' : state.listState==='loading' ? '骨架屏' : '错误条'];
  const p = PAGES[page];
  const n = tab && TAB_BODY_NAMES[page] && TAB_BODY_NAMES[page][tab];
  return n || BODY_NAMES[p.kind] || ['内容'];
}
function bodyNames(page, kind){
  const p = PAGES[page];
  const tab = p && p.tabs ? (state.tabs[page] || p.tabs[0]) : null;
  return bodyNamesFor(page, tab);
}
function toolbarHtml(p){
  let h = '<div class="toolbar">';
  if(p.search) h += `<div class="field">${ic('search')}<span>${p.search}</span></div>`;
  if(p.period) h += `<div class="segline">${p.period.map((x,i)=>`<button class="segbtn${i===0?' on':''}">${x}</button>`).join('')}</div>`;
  (p.buttons||[]).forEach(b=>{ h += `<button class="btn${b.startsWith('＋')?' primary':''}"${b.startsWith('＋')?' data-act="add"':''}>${b}</button>`; });
  h += '</div>';
  return h;
}

  const arr = [];

  return `<div class="panelwin">
    <div class="panel-top"><span>magpie</span><span class="grow"></span><button class="iconbtn" data-act="update">↻</button></div>
    <div class="panel-tabs">${['智能体','额度','用量','路由'].map(x=>`<button class="ptab${state.panelTab===x?' on':''}" data-ptab="${x}">${x}</button>`).join('')}</div>
    <div class="panel-body">${panelBody()}</div>
    <div class="panel-foot"><button class="textbtn" data-act="openWindow">打开窗口</button><span class="grow"></span><button class="textbtn" data-act="quit">退出</button></div>
    ${overlayHtml()}${toastHtml()}
  </div>`;
}
function phoneShell(){
  return `<div class="phonewin">
    <div class="phone-top"><span>magpie</span><span class="grow"></span><button class="iconbtn" data-page="settings">${ic('gear')}</button></div>
    ${state.page==='settings' ? '' : pageStrip()}
    <div class="phone-main">${mainView()}</div>
    <nav class="phone-secs">${SECTIONS.map(sec=>`<button class="psec${state.page!=='settings'&&state.section===sec.id?' on':''}" data-sec="${sec.id}">${sec.name}</button>`).join('')}</nav>
    ${overlayHtml()}${toastHtml()}
  </div>`;
}
function renderStage(){
  if(state.form==='panel') stage.innerHTML = panelShell();
  else if(state.form==='phone') stage.innerHTML = phoneShell();
  else stage.innerHTML = state.frame==='wide'
    ? `<div class="win wide">${topbar(false)}<div class="main">${navSide()}${mainView()}</div>${footerbar()}${overlayHtml()}${toastHtml()}</div>`
    : `<div class="win narrow">${topbar(true)}${state.compact ? compactNav() : secStrip()+pageStrip()}${mainView()}${footerbar()}${overlayHtml()}${toastHtml()}</div>`;
  const sec = SECTIONS.find(s=>s.id===state.section);
  const where = state.page==='settings' ? '设置' : ((sec ? sec.name + ' › ' : '') + PAGES[state.page].name);
  document.getElementById('where').textContent = where;
  document.querySelectorAll('#frameSeg button[data-f]').forEach(b=>b.classList.toggle('on', b.dataset.f===state.frame));
  document.getElementById('specBtn').textContent = '标注：' + (state.spec ? '开' : '关');
  document.getElementById('navBtn').textContent = '窄窗：' + (state.compact ? '一行' : '两行');
  document.getElementById('stateBtn').textContent = '状态：' + ({normal:'正常',empty:'空',loading:'加载',error:'错误'}[state.listState]);
  document.getElementById('formBtn').textContent = '形态：' + ({window:'窗口',panel:'托盘',phone:'手机'}[state.form]);
  if(state.sheet){ const sh=document.querySelector('.sheet-inline'); if(sh) sh.scrollIntoView({block:'nearest'}); }
  if(state.frame==='narrow' && state.compact){ const nav=document.querySelector('.win.narrow .tabstrip'); const on=nav && nav.querySelector('.tab.on'); if(on) nav.scrollLeft = Math.max(0, on.offsetLeft - 60); }
  const regions = regionsFor(state.page, PAGES[state.page]).map(r=>r[0]);
  const selTxt = state.sel ? ('已选：' + where + ' · 区域 ' + state.sel.n + ' · ' + state.sel.name) : ('当前页：' + where);
  document.getElementById('caption').textContent = selTxt + ' · 本页区域：' + regions.join(' · ') + '。';
  const info = TAB_SPEC[state.page] || {};
  const pinfo = SPEC_INFO[state.page] || {};
  document.getElementById('pageSpec').innerHTML = '<table><thead><tr><th>编号</th><th>区域</th><th>由哪些组件组成</th><th>改动位置</th></tr></thead><tbody>' +
    regions.map((name,i)=>{
      const it = info[name] || pinfo[name] || ['内容模块','bodyBlocks · .list/.item'];
      return '<tr class="' + (state.sel && state.sel.n===i+1 ? 'on' : '') + '"><td>' + (i+1) + '</td><td>' + name + '</td><td>' + it[0] + '</td><td class="comps">' + it[1] + '</td></tr>';
    }).join('') + '</tbody></table>';

  document.getElementById('compIndex').innerHTML = '<table><thead><tr><th>编号</th><th>组件</th><th>样式类</th><th>用在哪</th><th>改这里</th></tr></thead><tbody>' +
    COMPONENTS.map(c=>'<tr><td>' + c[0] + '</td><td>' + c[1] + '</td><td class="comps">' + c[2] + '</td><td class="secn">' + c[3] + '</td><td class="comps">' + c[4] + '</td></tr>').join('') + '</tbody></table>';
}
stage.addEventListener('click', e=>{
  const pt = e.target.closest('[data-ptab]');
  if(pt){ state.panelTab = pt.dataset.ptab; renderStage(); return; }
  const sw = e.target.closest('[data-sw]');
  if(sw){ const n = sw.dataset.sw; state.sw[n] = !sw.classList.contains('on'); renderStage(); return; }
  const pr = e.target.closest('[data-provider]');
  if(pr){ state.providerOpen = state.providerOpen===pr.dataset.provider ? null : pr.dataset.provider; renderStage(); return; }
  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='add'){ if(state.page==='agents') state.ov={kind:'addAgent'}; else { state.sheet = true; state.ov = null; } }
    else if(a==='delProvider') state.ov={kind:'confirm', title:'删除供应商？', body:'删除后无法恢复，使用它的请求会失败。', ok:'删除'};
    else if(a==='rename') state.ov={kind:'rename', title:'重命名 / 移动会话'};
    else if(a==='lang') state.ov={kind:'pick', title:'语言', items:['简体中文','繁體中文','English','日本語','Deutsch'], selected:'简体中文'};
    else if(a==='shortcut') state.ov={kind:'shortcut', title:'快速面板快捷键', key:'⌃ ⌘ Space'};
    else if(a==='ctxtext') state.ov={kind:'ctxtext', title:'上下文 · 系统提示'};
    else if(a==='updateProgress') state.ov={kind:'updateProgress', title:'正在下载 0.1.2401'};
    else if(a==='request') state.ov={kind:'request', title:'请求详情'};
    else if(a==='update') state.ov={kind:'update', title:'发现新版本 0.1.2401'};
    else if(a==='delKey') state.ov={kind:'confirm', title:'删除密钥？', body:'删除后无法恢复，使用它的请求会失败。', ok:'删除'};
    else if(a==='editProvider'){ state.ov={kind:'providerEdit', title:'编辑供应商'}; state.editDirty=false; }
    else if(a==='editKey') state.ov={kind:'edit', title:'编辑密钥', fields:[['名称','openai-key'],['密钥','sk-••••••••'],['模型','全部']]};
    else if(a==='model') state.ov={kind:'pick', title:'选择模型', items:['gpt-5.6-sol','opus-4.6','gemini-3-pro','qwen-3-max'], selected:'gpt-5.6-sol'};
    else if(a==='font') state.ov={kind:'font', title:'界面字体'};
    else if(a==='import') state.ov={kind:'import', title:'导入配置'};
    else if(a==='retry') state.listState='normal';
    else if(a==='openWindow') state.form='window';
    else if(a==='quit') state.ov={kind:'quit', title:'退出 magpie？'};
    renderStage(); return;
  }
  if(e.target.closest('[data-closesheet]')){ state.sheet = false; renderStage(); return; }
  if(e.target.closest('[data-ovclose]')){ closeOv(); return; }
  if(e.target.closest('[data-ovsave]')){ state.ov = null; state.editDirty = false; renderStage(); return; }
  const ov = e.target.closest('.ov');
  if(ov){
    if(!e.target.closest('.ov-sheet') && !e.target.closest('.ov-menu')){ closeOv(); return; }
    return;
  }
  const danger = e.target.closest('.btn.danger');
  if(danger){ state.ov={kind:'confirm', title:'确认删除？', body:'此操作不可撤销。', ok:'删除'}; renderStage(); return; }
  const btn = e.target.closest('.btn, .textbtn');
  if(btn){ showToast('已执行：' + (btn.textContent.trim() || '操作')); return; }
  const h = e.target.closest('.spec-head');
  if(h){ state.sel = {n:+h.dataset.rn, name:h.dataset.rname}; renderStage(); return; }
  const md = e.target.closest('[data-mdsel]');
  if(md){ state.mdSel = +md.dataset.mdsel; renderStage(); return; }
  const ls = e.target.closest('[data-libsel]');
  if(ls){ state.libSel = +ls.dataset.libsel; renderStage(); return; }
  const s = e.target.closest('[data-sec]');
  if(s){
    const sec = SECTIONS.find(x=>x.id===s.dataset.sec);
    state.section = sec.id; state.page = sec.pages[0]; state.sel = null; state.libSel = 0; state.mdSel = 0; renderStage(); return;
  }
  const p = e.target.closest('[data-page]');
  if(p){
    state.page = p.dataset.page;
    const sec = sectionOf(state.page);
    if(sec) state.section = sec.id;
    state.sel = null; state.libSel = 0; state.mdSel = 0; renderStage(); return;
  }
  const v = e.target.closest('[data-vtab]');
  if(v){ state.tabs[state.page] = v.dataset.vtab; state.sel = null; state.libSel = 0; state.mdSel = 0; renderStage(); return; }
  const l = e.target.closest('[data-l3]');
  if(l){ state.l3 = l.dataset.l3; state.sel = null; state.libSel = 0; state.mdSel = 0; renderStage(); }
});
stage.addEventListener('contextmenu', e=>{
  const row = e.target.closest('[data-mdrow]');
  if(!row || state.page!=='providers') return;
  e.preventDefault();
  const wr = row.closest('.win').getBoundingClientRect();
  state.ov = {kind:'menu'}; state.menuAt = {x:e.clientX-wr.left, y:e.clientY-wr.top};
  renderStage();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (state.ov || state.sheet)){ if(state.ov) closeOv(); else { state.sheet = false; renderStage(); } }
});
stage.addEventListener('input', e=>{ if(e.target.classList.contains('ov-input')) state.editDirty = true; });
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
  const item = document.activeElement && document.activeElement.closest && document.activeElement.closest('.lib-item');
  if(!item) return;
  e.preventDefault();
  const items = [...item.closest('.lib-list').querySelectorAll('.lib-item')];
  const i = items.indexOf(item);
  const next = items[e.key==='ArrowDown' ? Math.min(items.length-1, i+1) : Math.max(0, i-1)];
  if(!next || next===item) return;
  const isLib = next.hasAttribute('data-libsel');
  if(isLib) state.libSel = +next.dataset.libsel; else state.mdSel = +next.dataset.mdsel;
  renderStage();
  const sel = document.querySelector(isLib ? `[data-libsel="${state.libSel}"]` : `[data-mdsel="${state.mdSel}"]`);
  if(sel) sel.focus();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  const el = document.activeElement, tab = el && el.closest && el.closest('.tab, .ptab, .sec, .psec');
  if(!tab) return;
  e.preventDefault();
  const group = tab.parentElement;
  const tabs = [...group.querySelectorAll('.tab, .ptab, .sec, .psec')];
  const i = tabs.indexOf(tab);
  const next = tabs[e.key==='ArrowRight' ? Math.min(tabs.length-1, i+1) : Math.max(0, i-1)];
  if(next) next.focus();
});
function renderAllIndex(){
  const rows = [];
  Object.keys(PAGES).forEach(id=>{
    const p = PAGES[id];
    const sec = sectionOf(id);
    const tabs = p.tabs ? p.tabs : [null];
    tabs.forEach(tab=>{
      const regions = [];
      if(p.tabs) regions.push('标签条');
      if(id==='settings' && tab==='额度') regions.push('子标签');
      regions.push('工具栏');
      regions.push(...bodyNamesFor(id, tab));
      const infoOf = n => (TAB_SPEC[id] && TAB_SPEC[id][n]) || (SPEC_INFO[id] && SPEC_INFO[id][n]) || ['—','—'];
      const comps = regions.map(n=>infoOf(n)[0]).join(' / ');
      const where = regions.map(n=>infoOf(n)[1]).join(' / ');
      rows.push({
        title: (sec ? sec.name + ' › ' : '') + p.name + (tab ? ' › ' + tab : ''),
        regions: regions.map((n,i)=>(i+1)+' '+n).join(' / '),
        comps, where,
      });
    });
  });
  document.getElementById('allIndex').innerHTML = '<table><thead><tr><th>页面 / 视图</th><th>区域（编号）</th><th>由哪些组件组成</th><th>改动位置</th></tr></thead><tbody>' +
    rows.map(r=>'<tr><td>'+r.title+'</td><td>'+r.regions+'</td><td>'+r.comps+'</td><td class="comps">'+r.where+'</td></tr>').join('') + '</tbody></table>';
}
document.getElementById('frameSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-f]');
  if(!b) return;
  state.frame = b.dataset.f; renderStage();
});
document.getElementById('navBtn').addEventListener('click', ()=>{ state.compact = !state.compact; renderStage(); });
document.getElementById('formBtn').addEventListener('click', ()=>{ const forms=['window','panel','phone']; state.form = forms[(forms.indexOf(state.form)+1)%forms.length]; renderStage(); });
document.getElementById('stateBtn').addEventListener('click', ()=>{ const states=['normal','empty','loading','error']; state.listState = states[(states.indexOf(state.listState)+1)%states.length]; renderStage(); });
document.getElementById('specBtn').addEventListener('click', ()=>{
  state.spec = !state.spec; state.sel = null; renderStage();
});
document.getElementById('themeBtn').addEventListener('click', ()=>{
  state.theme = state.theme==='light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = state.theme==='dark' ? 'dark' : '';
});
renderStage();
renderAllIndex();
</script>
</body>
</html>
