<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magpie · 布局细节版</title>
<style>
:root{
  --bg:#f4f4f6; --card:#fff; --card-2:#f9f9fb; --pill:#f1f1f4; --pill-hover:#e9e9ee;
  --seg-track:#e6e6eb; --seg-thumb:#fff;
  --seg-edge:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);
  --line:#e3e3e8; --line-2:#ececf0; --fg:#1c1c21; --fg-2:#4b4b53; --muted:#85858d; --faint:#b9b9c2;
  --ctl:#63636b; --accent:#4f46e5; --accent-soft:#eeedfd; --accent-fg:#fff;
  --green:#189a58; --amber:#b45309; --red:#d64545;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --code:ui-monospace,"SF Mono",Menlo,Consolas,"Microsoft YaHei UI",monospace;
  --shadow:0 16px 44px rgba(20,22,30,.16),0 2px 8px rgba(20,22,30,.06),0 0 0 .5px rgba(20,22,30,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.07);
  --stage:#e6e7ec; --pop:rgba(255,255,255,.94);
}
[data-theme="dark"]{
  --bg:#1a1a1e; --card:#232327; --card-2:#1f1f23; --pill:#2d2d33; --pill-hover:#36363d;
  --seg-track:rgba(255,255,255,.035); --seg-thumb:rgba(255,255,255,.15);
  --seg-edge:inset 0 .5px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.3);
  --line:#333339; --line-2:#2c2c32; --fg:#ededf1; --fg-2:#b9b9c1; --muted:#8b8b94; --faint:#56565f;
  --ctl:#a1a1aa; --accent:#a5b4fc; --accent-soft:#2b2c47; --accent-fg:#14142a;
  --green:#6fd99b; --amber:#f2b544; --red:#f28b82;
  --shadow:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.09);
  --stage:#0f1013; --pop:rgba(38,38,43,.96);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--fg);background:var(--stage);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:64px 14px 28px;gap:12px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;appearance:none;text-align:left}
kbd{font:11px var(--code);color:var(--faint);background:var(--card);padding:1px 4px;border-radius:4px;box-shadow:0 0 0 .5px var(--line)}
.ic{width:16px;height:16px;flex:none;color:var(--muted)}

/* 原型顶栏 */
.proto{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px 8px;padding:5px 8px;border-radius:12px;background:var(--pop);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 24px)}
.ptitle{font-size:12px;font-weight:600;color:var(--fg-2);padding:0 2px;white-space:nowrap}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--seg-track)}
.seg button{height:24px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--ctl);white-space:nowrap}
.seg button.on{background:var(--seg-thumb);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.sep{width:1px;height:18px;background:var(--line)}
.tbtn{height:24px;padding:0 9px;border-radius:7px;font-size:12px;color:var(--ctl);background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.tbtn:hover{color:var(--fg)}
.wlabel{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* 模拟窗口 */
.win{flex:none;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.win.wide{width:1180px;max-width:100%;height:740px}
.win.narrow{width:720px;max-width:100%;height:740px}
.top{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none;border-bottom:.5px solid var(--line-2)}
.lights{display:flex;gap:7px;margin-right:2px}
.lights i{width:11px;height:11px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.brand{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;letter-spacing:.01em;white-space:nowrap}
.logo{width:18px;height:18px;color:var(--fg);display:inline-flex}
.logo svg{display:block;width:100%;height:100%}
.crumb{font-size:12.5px;color:var(--muted);padding-left:4px;white-space:nowrap}
.actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.btn{height:28px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--fg-2);background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.03);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.iconbtn{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover,.iconbtn.on{background:var(--pill);color:var(--fg)}
.main{flex:1;display:flex;min-height:0}

/* 宽窗侧栏 */
.side{width:212px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--line);background:var(--bg)}
.head{height:46px;display:flex;align-items:center;gap:7px;padding:0 12px;flex:none}
.jump{margin:0 8px 6px;display:flex;align-items:center;gap:6px;height:26px;padding:0 7px;border-radius:7px;background:var(--pill);color:var(--muted);font-size:11.5px;width:calc(100% - 16px)}
.jump:hover{background:var(--pill-hover)}
.jump span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump .ic{width:13px;height:13px}
.scroll{flex:1;overflow:auto;padding:0 8px 8px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:5px;padding:10px 7px 3px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.grp:first-child{padding-top:2px}
.grp .chev{margin-left:auto;color:var(--faint);width:13px;height:13px}
.row{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 7px;border-radius:7px;font-size:13px;color:var(--fg-2);white-space:nowrap}
.row:hover{background:var(--pill);color:var(--fg)}
.row.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.row .ic{width:16px;height:16px}
.row.on .ic{color:var(--fg)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
/* 侧栏二级：当前页的页内标签 */
.subwrap{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px 13px;padding-left:7px;border-left:1px solid var(--line)}
.srow{display:flex;align-items:center;height:24px;padding:0 7px;border-radius:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow:hover{background:var(--pill);color:var(--fg)}
.srow.on{color:var(--fg);font-weight:500;background:var(--card);box-shadow:var(--seg-edge)}
.footnav{flex:none;max-height:62%;overflow:auto;border-top:.5px solid var(--line-2);padding:6px 8px 8px;display:flex;flex-direction:column;gap:1px;scrollbar-width:none}
.footnav::-webkit-scrollbar{display:none}
.gw{font-size:11.5px;color:var(--muted);height:28px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.amber{background:var(--amber)}
.dot.red{background:var(--red)}

/* 窄窗一级标签 */
.tabstrip{flex:none;height:40px;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:.5px solid var(--line-2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none;width:0;height:0}
.tab{flex:none;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--ctl);white-space:nowrap}
.tab:hover{background:var(--pill);color:var(--fg)}
.tab.on{background:var(--card);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.tsep{flex:none;width:1px;height:14px;background:var(--line);margin:0 4px}

/* 内容通用 */
.view{flex:1;min-width:0;overflow:auto;padding:14px 20px 28px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none;width:0;height:0}
.win.narrow .view{padding:12px 12px 24px}
.pagehead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pagehead h1{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.pagehead .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field{height:26px;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.03);display:flex;align-items:center;gap:5px;padding:0 8px;font-size:11.5px;color:var(--muted);width:180px}
.field .ic{width:13px;height:13px}
.banner{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:8px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:12px}
.banner .btn{margin-left:auto;background:transparent;box-shadow:none;color:var(--accent);font-weight:500}
.list{background:var(--card);border-radius:11px;box-shadow:var(--shadow-sm);overflow:hidden}
.prow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:.5px solid var(--line-2)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--card-2)}
.plogo{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.pwho{flex:1;min-width:0}
.pname{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.psub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pmeta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--muted);flex:none}
.pmeta b{color:var(--fg-2);font-weight:500;font-variant-numeric:tabular-nums}
.health{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.health i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.health.warn i{background:var(--amber)}
.health.bad i{background:var(--red)}
.chev{color:var(--faint);font-size:15px;line-height:1}
.foldrow{display:flex;align-items:center;gap:6px;margin:10px 2px 0;font-size:12px;color:var(--muted)}
.foldrow .note{font-size:11px;color:var(--faint)}

/* 窄窗页头与二级条 */
.nhead h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.nsearch{height:32px;margin:0 0 8px;border-radius:8px;background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.03);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--muted)}
.nsearch .ic{width:14px;height:14px}
.nbtns{display:flex;gap:6px;margin-bottom:10px}
.nbtns .btn{flex:1;height:30px;font-size:12px}
.pagestrip{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:0 0 9px;padding-bottom:1px}
.pagestrip::-webkit-scrollbar{display:none;width:0;height:0}
.pagestrip .tab{height:25px;padding:0 9px;border-radius:7px;font-size:12px}
.pagestrip.l3{margin-top:-4px}
.pagestrip.l3 .tab{height:24px;font-size:11.5px;padding:0 9px;color:var(--muted)}
.pagestrip.l3 .tab.on{color:var(--fg);background:var(--card-2);box-shadow:var(--seg-edge)}

/* 选项条 */
.optbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.segline{display:inline-flex;padding:2px;border-radius:8px;background:var(--seg-track);gap:1px}
.segline .segbtn{height:24px;padding:0 9px;border-radius:6px;font-size:11.5px;color:var(--ctl);white-space:nowrap}
.segline .segbtn.on{background:var(--seg-thumb);color:var(--fg);box-shadow:var(--seg-edge);font-weight:500}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{height:26px;padding:0 9px;border-radius:7px;font-size:11.5px;color:var(--ctl);background:var(--pill);white-space:nowrap}
.day.on{background:var(--accent);color:var(--accent-fg)}
.grow{flex:1}

/* 统计与图表 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.win.narrow .stats{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border-radius:10px;padding:9px 11px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .d{font-size:10.5px;color:var(--muted);margin-top:2px}
.chart{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.chart .k{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:72px;margin-top:7px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:var(--accent);opacity:.85;min-height:4px}
.bars i:nth-child(3n){opacity:.55}
.barlabels{display:flex;gap:6px;margin-top:4px;font-size:10px;color:var(--muted)}
.barlabels span{flex:1;text-align:center}

/* 设置行与控件 */
.srowline{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:.5px solid var(--line-2)}
.srowline:first-child{border-top:0}
.srowline .who{flex:1;min-width:0}
.nm2{font-size:12.5px;font-weight:500}
.sub2{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{width:34px;height:20px;border-radius:999px;background:var(--pill);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:16px}

/* 路由两栏 */
.rtcols{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.win.narrow .rtcols{grid-template-columns:1fr}
.rtcard{background:var(--card);border-radius:11px;box-shadow:var(--shadow-sm);overflow:hidden}
.rtcard h4{font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 12px 6px}
.rtrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:.5px solid var(--line-2);font-size:12px}
.rtrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtrow .t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.quota{height:5px;border-radius:3px;background:var(--pill);width:66px;overflow:hidden;flex:none}
.quota i{display:block;height:100%;background:var(--accent)}
.plogo.sm{width:22px;height:22px;font-size:10px;border-radius:6px}

/* 插件行 */
.plugrow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:.5px solid var(--line-2)}
.plugrow:first-child{border-top:0}
.plugrow .who{flex:1;min-width:0}

/* 图例 */
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);padding:0 4px}
.legend .lv{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);margin-right:5px;font-style:normal}
.specnote{width:1180px;max-width:100%;font-size:11.5px;color:var(--muted);line-height:1.6;background:var(--card);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow-sm)}

/* 底栏 */
.footbar{flex:none;height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-top:.5px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.footbar .status{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.textbtn{font-size:11.5px;color:var(--muted);padding:0 6px;height:22px;border-radius:5px;white-space:nowrap}
.textbtn:hover{background:var(--pill);color:var(--fg)}
</style>
</head>
<body>

<div class="proto">
  <span class="ptitle">布局细节版</span>
  <div class="seg" id="frameSeg">
    <button data-f="narrow" class="on">窄窗</button>
    <button data-f="wide">宽窗</button>
  </div>
  <span class="sep"></span>
  <div class="seg" id="pageSeg">
    <button data-p="providers" class="on">供应商</button>
    <button data-p="usage">用量</button>
    <button data-p="settings">设置</button>
    <button data-p="library">资源库</button>
    <button data-p="routing">路由</button>
    <button data-p="plugins">插件</button>
  </div>
  <span class="sep"></span>
  <span class="wlabel" id="wlabel"></span>
  <button class="tbtn" id="themeBtn">明 / 暗</button>
</div>

<div id="stage"></div>

<div class="legend">
  <span><i class="lv">1</i>一级页面：宽窗在侧栏，窄窗在顶栏</span>
  <span><i class="lv">2</i>二级页面标签：宽窗变侧栏缩进行，窄窗变页内横条</span>
  <span><i class="lv">3</i>三级组内标签：只在设置 › 额度里</span>
  <span><i class="lv">4</i>顶部选项：筛选、日期、操作</span>
</div>

<p class="specnote">分组 A–D 仍是占位。这一版只把“层级怎么放”做细：用量 5 个页内标签、资源库 6 个、插件 3 个、设置 9 个二级 + 额度里 4 个三级；路由和供应商主要靠顶部选项。切到宽窗能看到同一批标签怎么缩进到侧栏。</p>

<script>
const ICONS = {
  agents:'<path d="M4 6l4 4-4 4M10 14h6"/>',
  sessions:'<path d="M4 5h12v8H9l-4 3v-3H4z"/>',
  library:'<path d="M5 3.5h9v13H5a1.5 1.5 0 0 1 0-3h9"/>',
  providers:'<circle cx="7" cy="10" r="3"/><path d="M10 10h7M14 10v3M16.5 10v2"/>',
  routing:'<path d="M3 10h5l4-5h5M8 10l4 5h5M14.5 3l2.5 2-2.5 2M14.5 13l2.5 2-2.5 2"/>',
  gateway:'<rect x="3" y="4" width="14" height="5" rx="1.5"/><rect x="3" y="11" width="14" height="5" rx="1.5"/><path d="M6 6.5h.01M6 13.5h.01"/>',
  usage:'<path d="M4 16V9M8 16V5M12 16v-5M16 16V7"/>',
  shield:'<path d="M8 1.8 13 3.6v4.1c0 3-2.1 5.4-5 6.5-2.9-1.1-5-3.5-5-6.5V3.6Z"/>',
  doctor:'<circle cx="10" cy="10" r="7"/><path d="M10 6.5v7M6.5 10h7"/>',
  gauge:'<path d="M3.5 14a6.5 6.5 0 1 1 13 0"/><path d="M10 13l3.2-4.2"/><circle cx="10" cy="13" r="1"/>',
  plug:'<path d="M8 3.5h4v2.5a1.5 1.5 0 0 0 3 0V3.5h1.5v13H4v-4h2.5a1.5 1.5 0 0 0 0-3H4v-6z"/>',
  gear:'<circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6 15 15M15 5l-1.4 1.4M6.4 13.6 5 15"/>',
  search:'<circle cx="8" cy="8" r="4.5"/><path d="m11.5 11.5 3 3"/>',
  chev:'<path d="m6 8 4 4 4-4"/>',
};
function ic(k, cls='ic'){
  return `<svg class="${cls}" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]||''}</svg>`;
}
function logo(){

function navSide(){

function topTabs(){

const VIEWS = { providers:providersView, usage:usageView, settings:settingsView, library:libraryView, routing:routingView, plugins:pluginsView };
function pageView(wide){
  const fn = VIEWS[state.page];
  return fn ? fn(wide) : genericView(wide, PAGES[state.page]);
}
function topbar(withBrand){
  const gearOn = state.page==='settings' ? ' on' : '';
  return `<header class="top">
    <div class="lights"><i></i><i></i><i></i></div>
    ${withBrand?`<div class="brand">${logo()}<span>magpie</span></div>`:`<div class="crumb">${PAGES[state.page].name}</div>`}
    <div class="actions"><button class="btn">更新</button><button class="iconbtn${gearOn}" data-page="settings">${ic('gear')}</button></div>
  </header>`;
}
function footbar(){
  return `<footer class="footbar"><span class="status"><span class="dot"></span>网关运行中 · 4 个会话已连接</span><span class="grow"></span><button class="textbtn">退出</button></footer>`;
}
function shellWide(){
  return `<div class="win wide">${topbar(false)}<div class="main">${navSide()}${pageView(true)}</div>${footbar()}</div>`;
}
function shellNarrow(){
  return `<div class="win narrow">${topbar(true)}${topTabs()}${pageView(false)}${footbar()}</div>`;
}
function renderStage(){
  stage.innerHTML = state.frame==='wide' ? shellWide() : shellNarrow();
  wlabel.textContent = state.frame==='wide' ? '窗口宽 1180 · ≥ 1024' : '窗口宽 720 · < 1024';
  document.querySelectorAll('#pageSeg button[data-p]').forEach(b=>b.classList.toggle('on', b.dataset.p===state.page));
  document.querySelectorAll('#frameSeg button[data-f]').forEach(b=>b.classList.toggle('on', b.dataset.f===state.frame));
}

document.getElementById('frameSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-f]');
  if(!b) return;
  state.frame = b.dataset.f;
  renderStage();
});
document.getElementById('pageSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-p]');
  if(!b) return;
  state.page = b.dataset.p;
  renderStage();
});
document.getElementById('themeBtn').addEventListener('click', ()=>{
  state.theme = state.theme==='light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = state.theme==='dark' ? 'dark' : '';
});
stage.addEventListener('click', e=>{
  const p = e.target.closest('[data-page]');
  if(p){ state.page = p.dataset.page; renderStage(); return; }
  const s = e.target.closest('[data-sub]');
  if(s){ const of = s.dataset.subOf || state.page; if(subState[of]!==undefined) subState[of] = s.dataset.sub; renderStage(); return; }
  const l = e.target.closest('[data-l3]');
  if(l){ state.l3 = l.dataset.l3; renderStage(); }
});
renderStage();
