name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:30 Beijing: after the day's pushes, before the review window.
    # Runs the whole Test workflow, the test-ui-nightly job with it.
    - cron: '30 19 * * *'

# On main a run finishes: a release waits for a green run, and one cancelled
# by every next push left none to wait for (LESSONS.md). A newer push still
# replaces a run that hasn't started. A PR's run is cancelled by its next push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The GUI links GTK 3 and WebKitGTK 4.1 through cgo on Linux (see the
      # Makefile), so vet and test need their headers and the gtk3 tag.
      # A stuck apt mirror held main's run here for 2.5 hours (b0d456c3), and
      # every later push queued behind it; it takes under a minute.
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        id: tags
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then echo "tags=gtk3" >> "$GITHUB_OUTPUT"; fi

      # Unformatted files reached main 8 times from 10-01 to 10-06 and each
      # took a gofmt commit of its own. Linux only: Windows checks out CRLF.
      - name: Gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # internal/gateway takes 450-600s on macOS runners, and go test's
      # default 10m timed it out in 3 of 8 finished main runs (#2108).
      - name: Test
        if: runner.os != 'Windows'
        run: go test -timeout 30m -tags "${{ steps.tags.outputs.tags }}" ./...

      # Windows skips the Test step above, so the two plugin stderr tests run
      # here. The end-to-end one needs bun on PATH; without it it skips.
      - name: Plugin stderr tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bun --version
          go test -v -count=1 ./internal/plugin/ -run '^(TestHostStartsPastAnOverlongStderrLine|TestDrainStderrKeepsTheChildGoing)$'

      - name: Production plugin flow
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          MAGPIE_FLOW_BIG: '1'
        run: |
          bun --version
          go test -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/plugin/... -run '^TestFlowBigReplyProd$' -count=1

      # The redaction tests reuse this binary in fresh processes to check
      # first-use races, so it must include the race detector. The gateway's
      # tests can't call t.Parallel (t.Setenv), so its suite runs split over
      # one process per core (#923); each process isolates its own home.
      - name: Race
        if: runner.os != 'Windows'
        shell: bash
        run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags "${{ steps.tags.outputs.tags }}" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m
          go test -race -tags "${{ steps.tags.outputs.tags }}" ./internal/redact/

      # Account usage mixes cached results with concurrent fetches.
      - name: Race account usage
        if: runner.os != 'Windows'
        run: go test -race -tags "${{ steps.tags.outputs.tags }}" ./internal/provider/ -run '^Test(LoginUsage|SubscriptionUsageEachAccount)'

      # Some tests fake a home through $HOME, which Windows doesn't read
      # (USERPROFILE), or assume Unix file modes. Compile the full suite
      # on Windows and run the isolated native checks below.
      - name: Compile tests
        if: runner.os == 'Windows'
        run: go test -run '^$' ./...

      # These checks use in-memory errors and loopback test servers. Run
      # the native Winsock refusal case rather than only compiling it.
      - name: Windows MCP health
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/library -run '^(TestNetHealth|TestCheckHTTP)$'

      # Usage isolates USERPROFILE and the agent homes; execute its native
      # ChangeTime checks rather than only cross-compiling the Windows API.
      - name: Windows usage cache
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/usage -run '^(TestWindows|TestLogChange|TestLogFileInfoPreservesIdentity$|TestUsageSameSizeAndMtimeRewrite$|TestLogGrowingRewriteThenAppend$|TestUsagePageCacheAfterUncachedQuery$)'

      # Install tests keep their files in t.TempDir; exercise real Windows
      # executable and held-handle rename/rollback behavior, and the trial
      # start before the install (#2272).
      - name: Windows update install
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/update -run '^(TestInstallBinary|TestMoveAside|TestTrialStart)'

      # These tests use temporary paths, without the Unix HOME assumptions
      # of the full suite. Run the native link-kind and sharing-error checks,
      # and the Codex copy checks that read NTFS ChangeTime (#1299).
      - name: Windows session moves
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/sessions -run '^Test(WindowsSession|Move|CopyAll|CodexArchived|CodexSameTick|CodexPlainTwin)'

      # dsh's layered config is read and edited in temporary homes. Run
      # these checks on Windows too, including Desktop's home patch layer.
      - name: Windows dsh configuration
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/agent -run '^Test(Dsh|KeepDsh)'

      - name: Windows VS Code detection
        if: runner.os == 'Windows'
        run: go test -v -count=1 ./internal/agent -run '^TestVSCodeDetected$'

  # The browser regressions under internal/gui/tests, in Playwright's
  # Chromium and WebKit (internal/gui/tests/README.md). The whole suite is
  # a many-hour affair — 10 files took 9.5 minutes on a loaded box, and
  # dfe868a1e's record had 882 files still going past a 3500s bound — so a
  # push runs the core files below, and the nightly schedule runs the
  # whole suite, split over six runners through node --test's --test-shard
  # (the Makefile's UI_TEST_SHARD). continue-on-error while main's GUI
  # suite has known reds (#4600, #4585 among them): the job shows its red
  # without holding a release; make it blocking once a night has been
  # green. The fixtures fake the platform marker, so the engines are what
  # is under test and Linux covers them; the local run stays the one that
  # covers the OS you develop on.
  test-ui:
    name: test-ui (core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright comes from the manifest beside the tests, the pattern
      # .github/ui-preview/package.json uses; the browsers need their
      # system libraries, WebKit's especially.
      - name: Install Playwright
        working-directory: internal/gui/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # The cross-page guards, and the pages the reds keep coming back on
      # (LESSONS keeps naming click-scroll, menu-scroll, i18n-keys,
      # searcher-pick, fold-show-grip, api-key-theme, the routing and
      # settings pages).
      - name: GUI browser regressions (core)
        run: >
          make test-ui UI_TEST_CONCURRENCY=4 UI_TESTS="
          internal/gui/tests/click-scroll.test.cjs
          internal/gui/tests/menu-scroll.test.cjs
          internal/gui/tests/sidebar-tab-top.test.cjs
          internal/gui/tests/segs-press-redraw.test.cjs
          internal/gui/tests/segs-glide.test.cjs
          internal/gui/tests/text-size.test.cjs
          internal/gui/tests/nav-timeout.test.cjs
          internal/gui/tests/i18n-keys.test.cjs
          internal/gui/tests/rail-tip.test.cjs
          internal/gui/tests/agent-models.test.cjs
          internal/gui/tests/agent-layout.test.cjs
          internal/gui/tests/routing-sessions.test.cjs
          internal/gui/tests/routing-days-fit.test.cjs
          internal/gui/tests/routing-kind.test.cjs
          internal/gui/tests/usage-ledger.test.cjs
          internal/gui/tests/api-key-theme.test.cjs
          internal/gui/tests/settings-sections.test.cjs
          internal/gui/tests/add-sheet.test.cjs
          internal/gui/tests/plain-names.test.cjs
          internal/gui/tests/bare-ids.test.cjs
          internal/gui/tests/panel-fold.test.cjs
          internal/gui/tests/update-check.test.cjs
          internal/gui/tests/searcher-pick.test.cjs
          internal/gui/tests/fold-show-grip.test.cjs
          internal/gui/tests/sse-body.test.cjs
          internal/gui/tests/json-tree.test.cjs
          "

  # The whole browser suite, six ways, on the nightly schedule (and on a
  # manual dispatch). Long: each shard waits on ~190 files at concurrency
  # 4, hours by the local record above, hence the 4h ceiling.
  test-ui-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: test-ui (shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        shards: [6]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: internal/gui/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: GUI browser regressions (whole suite)
        run: make test-ui UI_TEST_SHARD=${{ matrix.shard }}/${{ matrix.shards }} UI_TEST_CONCURRENCY=4

  cli:
    name: cli (${{ matrix.goos }}/${{ matrix.goarch }}, nogui)
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: android
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the terminal-only release
        env:
          CGO_ENABLED: '0'
        run: make release-cli TARGETS="${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: actions/setup-node@v4
        if: matrix.goos == 'linux'
        with:
          node-version: 22
      - name: Test the site and installer
        if: matrix.goos == 'linux'
        run: |
          sh -n site/public/install.sh
          node --test site/*.test.mjs
